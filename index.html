        // Variables de cache
        let dailyPredictionCache = null;
        let cacheDate = null;

        // PWA variables
        let deferredPrompt;

        // Obtenir la prédiction pour une date spécifique
        function getPredictionForDate(date) {
            const diffTime = date - APP_CREATION_DATE;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) {
                return null;
            }
            
            const predictionIndex = diffDays % predictions.length;
            return predictions[predictionIndex];
        }

        // Obtenir la prédiction du jour
        function getTodaysPrediction() {
            const today = new Date();
            return getPredictionForDate(today);
        }

        function getDailyPrediction() {
            const today = new Date().toDateString();
            
            if (cacheDate === today && dailyPredictionCache) {
                return dailyPredictionCache;
            }
            
            const prediction = getTodaysPrediction();
            dailyPredictionCache = prediction;
            cacheDate = today;
            
            return prediction;
        }

        // Révéler l'oracle
        function revealOracle() {
            const prediction = getDailyPrediction();
            
            if (prediction === null) {
                document.getElementById('prediction-text').textContent = "L'oracle n'existait pas encore à cette époque mystique...";
            } else {
                document.getElementById('prediction-text').textContent = prediction;
            }
            
            const today = new Date();
            const dateString = today.toLocaleDateString('fr-FR', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            document.getElementById('date-info').textContent = `Oracle du ${dateString}`;
            
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('oracle-screen').style.display = 'block';
        }

        // Vérification du changement de jour
        function checkForNewDay() {
            const today = new Date().toDateString();
            if (cacheDate && cacheDate !== today) {
                dailyPredictionCache = null;
                cacheDate = null;
                
                if (document.getElementById('oracle-screen').style.display === 'block') {
                    revealOracle();
                }
            }
        }

        // PWA Installation
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            showInstallPrompt();
        });

        function showInstallPrompt() {
            const installPrompt = document.getElementById('install-prompt');
            installPrompt.style.display = 'block';
            
            setTimeout(() => {
                if (installPrompt.style.display === 'block') {
                    installPrompt.style.display = 'none';
                }
            }, 10000);
        }

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    console.log('🔮 Installation choice:', choiceResult.outcome);
                    deferredPrompt = null;
                    document.getElementById('install-prompt').style.display = 'none';
                });
            }
        }

        function dismissInstall() {
            document.getElementById('install-prompt').style.display = 'none';
        }

        // Gestion URL params pour shortcuts
        function handleUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('shortcut') === 'today') {
                setTimeout(() => {
                    if (document.getElementById('welcome-screen').style.display !== 'none') {
                        revealOracle();
                    }
                }, 1000);
            }
        }

        // Vérifier au retour dans l'app
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                checkForNewDay();
            }
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((registration) => {
                        console.log('🔮 Service Worker enregistré:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('❌ Erreur Service Worker:', error);
                    });
            });
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            handleUrlParams();

        });

        // Prevention du zoom double-tap sur mobile
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
